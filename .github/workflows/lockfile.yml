name: Lockfile integrity

on:
  pull_request:
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"

jobs:
  frozen-lockfile:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.author.name, '[bot]')

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      # Fails if pnpm-lock.yaml is out of sync with any package.json.
      # Runs pre-install.sh only to clear nested submodule lockfiles, matching
      # the install step in test-apps.yml.
      - name: Verify pnpm-lock.yaml is up to date
        shell: bash
        run: bash scripts/pre-install.sh && pnpm install --frozen-lockfile
